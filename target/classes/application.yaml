server:
  port: 8085

spring:
  application:
    name: transactionExecution

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: ''
    password: ''
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

provider:
  account:
    url: http://localhost:8081